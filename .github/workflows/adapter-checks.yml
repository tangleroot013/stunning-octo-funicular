name: Adapter discovery & policy checks

on:
  push:
    branches: [ main, main, "stunning-octo/adapter" ]
  pull_request:
    paths:
      - 'src/plugins/**'
      - 'adapters.yaml'

jobs:
  adapter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
      - name: Run adapter discovery + tests
        run: |
          python -m pytest -q tests/test_plugins.py tests/test_adapter_policy.py
